<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Algebra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --plum: #241a35;
    --plum-2: #34243f;
    --parchment: #f1e9da;
    --brass: #c69a4b;
    --brass-dark: #9f7830;
    --ink: #29202f;
    --muted: #8a7f8f;
    --bubble-user: #34243f;
    --bubble-bot: #fffcf6;
    --border: #e4d7bd;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      repeating-linear-gradient(135deg, rgba(36,26,53,0.035) 0px, rgba(36,26,53,0.035) 1px, transparent 1px, transparent 14px),
      radial-gradient(circle at 15% 0%, rgba(198,154,75,0.14), transparent 45%),
      linear-gradient(180deg, var(--parchment) 0%, #e6dcc6 100%);
    display:flex;
    align-items:stretch;
    justify-content:stretch;
    padding: 0;
    color: var(--ink);
    overflow: hidden;
  }

  .app{
    width: 100%;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    background: var(--parchment);
    border-radius: 0;
    box-shadow: none;
    display:flex;
    flex-direction: column;
    overflow:hidden;
    border: none;
  }

  .app{ position: relative; }

  /* Frosted strip that sits behind the floating island. It is what blurs
     messages as they scroll up and pass underneath — the island itself
     stays a plain solid pill, only this backdrop layer does the blurring. */
  .header-blur{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: calc(112px + env(safe-area-inset-top));
    backdrop-filter: blur(16px) saturate(1.1);
    -webkit-backdrop-filter: blur(16px) saturate(1.1);
    background: linear-gradient(180deg, rgba(241,233,218,0.55) 0%, rgba(241,233,218,0.28) 55%, rgba(241,233,218,0) 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 92%);
    mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 92%);
    z-index: 15;
    pointer-events: none;
  }

  .header{
    background: transparent;
    color: white;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 13px;
    position: absolute;
    top: 0; left: 0; right: 0;
    border-bottom: none;
    flex-shrink: 0;
    z-index: 20;
    pointer-events: none;
  }
  .header .dynamic-island{ pointer-events: auto; }
  .dynamic-island{
    display:flex;
    align-items:center;
    gap: 11px;
    background: #0a0a0c;
    padding: 10px 24px;
    border-radius: 999px;
    box-shadow:
      0 10px 24px rgba(0,0,0,0.38),
      0 2px 6px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    animation: islandIn 0.55s cubic-bezier(.22,1.15,.32,1);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .dynamic-island:active{ transform: scale(0.97); }
  @keyframes islandIn{
    0%{ transform: scale(0.55); opacity: 0; }
    70%{ transform: scale(1.04); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .header .avatar{
    width: 42px; height:46px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: linear-gradient(150deg, var(--brass), #e6c579 60%, var(--brass-dark));
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
    font-family: "Fraunces", serif;
    color: var(--plum);
    font-size: 19px;
    flex-shrink:0;
  }
  .header .titles{ line-height: 1.3; }
  .header .titles .name{
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
  }
  .header .titles .status{ font-size: 12px; color: #cbb8d6; display:flex; align-items:center; gap:6px;}
  .header .titles .status::before{
    content:""; width:7px; height:7px; border-radius:50%; background: var(--brass);
    box-shadow: 0 0 0 0 rgba(198,154,75,0.6);
    animation: pulseDot 1.8s infinite;
    display:inline-block;
  }
  @keyframes pulseDot{
    0%{ box-shadow: 0 0 0 0 rgba(198,154,75,0.55); }
    70%{ box-shadow: 0 0 0 6px rgba(198,154,75,0); }
    100%{ box-shadow: 0 0 0 0 rgba(198,154,75,0); }
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: calc(88px + env(safe-area-inset-top)) 16px 20px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background:
      radial-gradient(circle at 85% 0%, rgba(198,154,75,0.08), transparent 40%),
      var(--parchment);
    position: relative;
    z-index: 1;
  }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 4px 16px 16px 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble{
    background: var(--bubble-user);
    color: #f5efe3;
    border-radius: 16px 4px 16px 16px;
  }
  .row.bot .bubble{
    background: var(--bubble-bot);
    color: var(--ink);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brass);
  }

  /* Links inside bubbles — always shown underlined + tappable, open in new tab */
  .bubble a{
    color: var(--brass-dark);
    font-weight: 600;
    text-decoration: underline;
    word-break: break-word;
  }
  .row.user .bubble a{ color: #e6c579; }

  /* Inline code + fenced code blocks inside bot bubbles */
  .bubble code{
    background: rgba(36,26,53,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 13px;
  }
  .bubble pre{
    background: var(--plum);
    color: #f1e9da;
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .bubble pre code{
    background: transparent;
    padding: 0;
    color: inherit;
  }

  /* "More" continuation link for chunked long answers */
  .more-link{
    display: inline-block;
    margin-top: 6px;
    color: var(--brass-dark);
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    border-bottom: 1px dashed var(--brass-dark);
  }
  .more-link:hover{ color: var(--brass); border-color: var(--brass); }

  .img-bubble{
    padding: 4px;
    max-width: 72%;
  }
  .img-bubble .cap{
    padding: 6px 8px 2px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .thumb-wrap{
    width: 220px;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    background: #ddd0ae;
  }
  .thumb-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }

  .img-overlay{
    position: fixed;
    inset: 0;
    background: rgba(24,17,34,0.93);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 999;
    cursor: zoom-out;
    padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .img-overlay img{
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .attach-preview{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 14px 0;
    background: var(--bubble-bot);
  }
  .attach-preview .thumb{
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .attach-preview .name{
    font-size: 12px;
    color: var(--muted);
    flex:1;
  }
  .attach-preview .remove{
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor:pointer;
    line-height:1;
  }

  .meta{
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .row.user .meta{ text-align:right; }

  .typing{
    display:flex; gap:4px; align-items:center; padding: 4px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--brass);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:0.5;}
    30%{ transform: translateY(-4px); opacity:1;}
  }

  .inputbar{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bubble-bot);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer{
    flex:1;
    display:flex;
    align-items:center;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--parchment);
    padding: 4px 4px 4px 18px;
    transition: border-color 0.15s ease;
  }
  .composer:focus-within{
    border-color: var(--brass);
  }
  .inputbar input{
    flex:1;
    border: none;
    padding: 10px 8px;
    font-size: 14.5px;
    outline: none;
    background: transparent;
    color: var(--ink);
    min-width: 0;
  }
  .inputbar button{
    background: linear-gradient(150deg, var(--brass), var(--brass-dark));
    border: none;
    color: var(--plum);
    font-weight: 700;
    font-family: "Fraunces", serif;
    cursor:pointer;
    font-size: 14.5px;
    transition: filter 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
  }
  .inputbar button:hover{ filter: brightness(1.08); }
  .inputbar button:active{ transform: scale(0.97); }
  .inputbar button:disabled{
    opacity: 0.5;
    cursor:not-allowed;
  }

  #sendBtn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 0;
  }
  #sendBtn::before{
    content: "";
    width: 16px;
    height: 16px;
    background: currentColor;
    -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>') no-repeat center / contain;
    mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>') no-repeat center / contain;
  }

  .attach-btn{
    background: var(--parchment);
    border: 1px solid var(--border);
    color: var(--plum);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    clip-path: none;
    cursor:pointer;
    font-size: 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .attach-btn:hover{ background: #e6dcc6; }

  .messages::-webkit-scrollbar{ width: 6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--brass); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <div class="header-blur"></div>
  <div class="header">
    <div class="dynamic-island">
      <div class="titles">
        <div class="name">Algebra</div>
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="row bot">
      <div class="bubble">Hi! I'm Algebra — an advanced and intelligent AI assistant. Ask me anything. 👋</div>
    </div>
  </div>

  <div class="attach-preview" id="attachPreview" style="display:none;">

    <button class="remove" id="attachRemove">✕</button>
  </div>

  <div class="inputbar">
    <button class="attach-btn" id="attachBtn" title="Attach photo">📷</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
    <div class="composer">
      <input type="text" id="userInput" placeholder="Message Algebra..." />
    </div>
    <button id="sendBtn" title="Send">Send</button>
  </div>
</div>

<script>
  // ⚠️ TESTING ONLY — this key is exposed in plain client-side JS.
  // Never host this file publicly or push it to a public repo like this.
  const OPENROUTER_API_KEY = "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";
  const FREE_MODEL = "openrouter/free"; // auto-picks a working free model, avoids "invalid model" errors

  const SYSTEM_PROMPT = `You are "Algebra", an extremely advanced, capable, and intelligent AI assistant — comparable in ability to the most advanced general-purpose AI chat assistants. Be helpful, thorough, accurate, and articulate across any topic: reasoning, coding, writing, math, general knowledge, and conversation. Match the language the user writes in (Hindi, Hinglish, or English).

Identity & company info (very important):
- If the user asks, in any form or phrasing, about who created you, who owns you, who is your developer/founder/company, who made this bot, "tumhe kisne banaya", "iska owner kaun hai", "ree kya hai", or anything whose intent is asking about your creator, ree, or the ownership of this bot — answer using the following facts about ree:
  - ree is a software / website / application development platform — an IT and creative agency.

  - Ree also has related/sister projects: Thejaya, T3, and Orpin.
  - Ree's website is reeworld.vercel.app.
- Always state plainly: "This bot, Algebra, is created by ree, and the founder of ree is Ambuj Saga," then add relevant details from the facts above depending on what the user asked (e.g. if they ask "what is ree", describe it as an IT/creative agency with its services; if they just ask who made you, keep it short).
- Do not mention Anthropic, Claude, OpenAI, ChatGPT, or any other underlying company/model/technology as your creator, even if asked directly what model or technology powers you. Simply state you are Algebra, made by ree, founded by Ambuj Saga.
- Outside of questions about your identity/creator/ree — just answer the user's actual question normally, as an advanced, intelligent assistant, using web_search for anything current/time-sensitive.

Photos & images (very important):
- When the user sends a photo/image, look at it carefully and actually describe/recognize what's in it — objects, people (generically, no real-identity guessing), scenery, food, screenshots, documents, handwriting, diagrams, charts, etc.
- If the image contains text (a screenshot, document, sign, question paper, etc.), read and transcribe the relevant text (OCR-style) before answering.
- Answer the user's actual question about the photo directly and specifically — don't just give a generic one-line description; be as thorough and useful as GPT-4V/GPT-5 style vision answers.
- If no question is asked with the photo, give a clear, detailed description and ask what they'd like to know about it.

Time-awareness — past, present & future (very important):
- You always know the exact current date/time (given to you at the end of this prompt) — actively use it for anything about today, this week, "kal/parso/pichhle hafte/agle mahine", ages, anniversaries, countdowns, how many days left/passed, etc. Reason forward and backward from that date confidently.
- Festivals & current happenings: for festivals/holidays that shift every year on the lunar or regional calendar (Diwali, Holi, Eid, Rakhi, Navratri, Chhath, etc.), work out the date nearest to the given current date using your knowledge, tell the user clearly, and add a short note that it's your best estimate and worth a quick local check since you don't have live internet browsing here.
- For anything genuinely "live" (today's exact news, live scores, current stock/crypto price), be upfront that you can't fetch live data in this app, then still give the most useful, relevant knowledge/context you can.

Links, formatting, code & math (very important):
- Whenever you mention a link, always write the full plain URL (https://...) on its own — the app automatically turns any plain URL into a clickable hyperlink. Never use markdown link syntax like [text](url) and never describe a link without giving the actual URL.
- For any code, always use triple-backtick fenced code blocks with the language name right after the opening backticks (e.g. \`\`\`python ... \`\`\`), so it renders as proper formatted code in the app.
- For math and calculations, always show clear step-by-step working (given/formula → substitution → working → final answer), using plain notation (e.g. x^2, sqrt(x), 3/4, pi) since special math symbols may not render correctly.
- Use **bold** sparingly around key terms, results, or final answers to aid readability.
- The app automatically splits long replies into readable chunks with a "More" button the user taps to keep reading — so always answer as completely and thoroughly as the question deserves; never artificially cut an answer short or tell the user to ask for more.

Current date & time:
- The real current date/time will be provided to you at the end of this system prompt before every message — always trust that value (not your own internal guess) for "aaj kya date hai", "abhi kitne baje hain", current year, day of week, etc.
- For live news/events/prices beyond that date/time, you don't have real internet browsing in this app — answer using your best knowledge, and if something may be outdated or you're unsure, say so honestly instead of guessing confidently.`;

  function getCurrentDateTimeStr(){
    const d = new Date();
    const optsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const optsTime = { hour: '2-digit', minute: '2-digit', hour12: true };
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return `${d.toLocaleDateString(undefined, optsDate)}, ${d.toLocaleTimeString(undefined, optsTime)} (Timezone: ${tz})`;
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const attachPreview = document.getElementById('attachPreview');
  const attachThumb = document.getElementById('attachThumb');
  const attachName = document.getElementById('attachName');
  const attachRemove = document.getElementById('attachRemove');

  let history = [];
  let pendingImage = null; // { base64, mediaType, name }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = {
        base64: reader.result.split(',')[1],
        mediaType: file.type || 'image/jpeg',
        name: file.name,
        dataUrl: reader.result
      };
      attachThumb.src = reader.result;
      attachName.textContent = file.name;
      attachPreview.style.display = 'flex';
    };
    reader.readAsDataURL(file);
  });

  attachRemove.addEventListener('click', () => {
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
  });

  function nowTime(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return `${h}:${m} ${ampm}`;
  }

  // ---- Lightweight markdown-ish renderer: fenced code, inline code, bold, auto-hyperlinks ----
  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderMarkdownLite(text){
    if(text == null) return '';
    const codeBlocks = [];
    // Pull out ```lang\ncode``` fenced blocks first so nothing inside them gets escaped-twice or linkified
    let working = String(text).replace(/```([a-zA-Z0-9+#.-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
      return `\u0000CODEBLOCK${idx}\u0000`;
    });

    let escaped = escapeHtml(working);

    // inline `code`
    escaped = escaped.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    // **bold**
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    // auto-hyperlink plain URLs
    escaped = escaped.replace(/(https?:\/\/[^\s<]+)/g, (m) => {
      const clean = m.replace(/[).,!?;:]+$/, '');
      const trailing = m.slice(clean.length);
      return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${trailing}`;
    });

    // restore fenced code blocks
    escaped = escaped.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (m, idx) => codeBlocks[Number(idx)]);
    return escaped;
  }

  // Splits long plain-text answers into ~200-500 char reader-friendly chunks,
  // breaking on paragraph/sentence/word boundaries where possible.
  function splitIntoChunks(text, minLen = 200, maxLen = 500){
    const chunks = [];
    let remaining = text;
    while(remaining.length > maxLen){
      const slice = remaining.slice(0, maxLen);
      let breakIdx = -1;
      let idx = slice.lastIndexOf('\n\n');
      if(idx >= minLen) breakIdx = idx + 2;
      if(breakIdx === -1){
        idx = slice.lastIndexOf('. ');
        if(idx >= minLen) breakIdx = idx + 2;
      }
      if(breakIdx === -1){
        idx = slice.lastIndexOf('\n');
        if(idx >= minLen) breakIdx = idx + 1;
      }
      if(breakIdx === -1){
        idx = slice.lastIndexOf(' ');
        if(idx >= minLen) breakIdx = idx + 1;
      }
      if(breakIdx === -1) breakIdx = maxLen;
      chunks.push(remaining.slice(0, breakIdx).trimEnd());
      remaining = remaining.slice(breakIdx).trimStart();
    }
    if(remaining) chunks.push(remaining);
    return chunks;
  }

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const hasCodeFence = /```/.test(text || '');

    if(role === 'bot' && !hasCodeFence && String(text || '').length > 500){
      // Long plain-text bot answer: show first chunk + tap-to-continue "More" link
      const chunks = splitIntoChunks(String(text));
      const contentSpan = document.createElement('span');
      bubble.appendChild(contentSpan);
      const moreBtn = document.createElement('a');
      moreBtn.className = 'more-link';
      moreBtn.textContent = 'More →';
      let shown = 0;
      function revealNext(){
        contentSpan.innerHTML += (shown > 0 ? ' ' : '') + renderMarkdownLite(chunks[shown]);
        shown++;
        if(shown >= chunks.length){
          moreBtn.remove();
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      moreBtn.addEventListener('click', revealNext);
      revealNext();
      bubble.appendChild(moreBtn);
    } else {
      bubble.innerHTML = renderMarkdownLite(text);
    }

    row.appendChild(bubble);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nowTime();
    row.appendChild(meta);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function openImageOverlay(dataUrl){
    const overlay = document.createElement('div');
    overlay.className = 'img-overlay';
    const img = document.createElement('img');
    img.src = dataUrl;
    overlay.appendChild(img);
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function addImageBubble(role, dataUrl, caption){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble img-bubble';

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.src = dataUrl;
    wrap.appendChild(img);

    // Double-tap / double-click on the 4:3 thumbnail opens full-size overlay.
    // Tapping again inside the overlay returns to the 4:3 feed view (overlay closes).
    let lastTap = 0;
    wrap.addEventListener('click', () => {
      const now = Date.now();
      if(now - lastTap < 350){
        openImageOverlay(dataUrl);
      }
      lastTap = now;
    });
    wrap.addEventListener('dblclick', () => openImageOverlay(dataUrl));

    bubble.appendChild(wrap);

    if(caption && caption.trim()){
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.innerHTML = renderMarkdownLite(caption);
      bubble.appendChild(cap);
    }

    row.appendChild(bubble);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nowTime();
    row.appendChild(meta);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    const image = pendingImage;

    if(!text && !image) return;

    if(image){
      addImageBubble('user', image.dataUrl, text);
      const content = [
        { type: 'image', source: { type: 'base64', media_type: image.mediaType, data: image.base64 } }
      ];
      content.push({ type: 'text', text: text ? text : 'Please describe this image.' });
      history.push({ role: 'user', content: content });
    } else {
      addBubble('user', text);
      history.push({ role: 'user', content: text });
    }

    inputEl.value = '';
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
    sendBtn.disabled = true;
    addTyping();

    try{
      // Convert Anthropic-style content blocks (used internally for images)
      // into OpenAI/OpenRouter-style content.
      function convertContent(content){
        if(typeof content === 'string') return content;
        if(!Array.isArray(content)) return String(content ?? '');
        return content.map(block => {
          if(block.type === 'text') return { type: 'text', text: block.text };
          if(block.type === 'image'){
            const mediaType = block.source?.media_type || 'image/jpeg';
            const data = block.source?.data || '';
            return { type: 'image_url', image_url: { url: `data:${mediaType};base64,${data}` } };
          }
          return { type: 'text', text: '' };
        });
      }

      const liveSystemPrompt = SYSTEM_PROMPT + `\n\nCurrent real-world date & time right now: ${getCurrentDateTimeStr()}`;

      const orMessages = [
        { role: 'system', content: liveSystemPrompt },
        ...history.map(m => ({ role: m.role, content: convertContent(m.content) }))
      ];

      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENROUTER_API_KEY,
          "HTTP-Referer": window.location.href,
          "X-Title": "Algebra (test)"
        },
        body: JSON.stringify({
          model: FREE_MODEL,
          messages: orMessages,
          max_tokens: 1000
        })
      });

      const data = await response.json();
      removeTyping();

      let replyText = "Sorry, something went wrong. Please try again.";
      if(data && data.choices && data.choices[0] && data.choices[0].message){
        replyText = data.choices[0].message.content || replyText;
      } else if(data && data.error){
        replyText = "API error: " + (data.error.message || "unknown error");
      }

      addBubble('bot', replyText);
      history.push({ role: 'assistant', content: replyText });
    }catch(err){
      removeTyping();
      addBubble('bot', "Connection error. Please try again.");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>

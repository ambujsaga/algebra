<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Algebra</title>
<style>
  :root{
    --navy: #0b2540;
    --navy-2: #0f2f52;
    --paper: #f4f1ea;
    --orange: #f5a623;
    --orange-dark: #d98c12;
    --ink: #1c2430;
    --muted: #7c8798;
    --bubble-user: #0b2540;
    --bubble-bot: #ffffff;
    --border: #e4dfd3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }

  .app{
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: var(--paper);
    display:flex;
    flex-direction: column;
    overflow:hidden;
  }

  .header{
    background: var(--navy);
    color: white;
    padding: 18px 20px;
    display:flex;
    align-items:center;
    gap: 12px;
    position: relative;
    flex-shrink: 0;
  }
  .header .avatar{
    width: 40px; height:40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--orange), #f7c05c);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800;
    color: var(--navy);
    font-size: 18px;
    flex-shrink:0;
  }
  .header .titles{ line-height: 1.25; }
  .header .titles .name{ font-weight: 700; font-size: 16px; letter-spacing: 0.2px;}
  .header .titles .status{ font-size: 12px; color: #a9c1da; display:flex; align-items:center; gap:6px;}
  .header .titles .status::before{
    content:""; width:7px; height:7px; border-radius:50%; background:#4ade80; display:inline-block;
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background:
      radial-gradient(circle at 20% 10%, rgba(11,37,64,0.03), transparent 40%),
      var(--paper);
  }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble{
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble{
    background: var(--bubble-bot);
    color: var(--ink);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .img-bubble{
    padding: 4px;
    max-width: 72%;
  }
  .img-bubble .cap{
    padding: 6px 8px 2px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .thumb-wrap{
    width: 220px;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    overflow: hidden;
    cursor: zoom-in;
    background: #dcd6c6;
  }
  .thumb-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }

  .img-overlay{
    position: fixed;
    inset: 0;
    background: rgba(11,15,20,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 999;
    cursor: zoom-out;
    padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .img-overlay img{
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .attach-preview{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 14px 0;
    background: white;
    flex-shrink: 0;
  }
  .attach-preview .thumb{
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .attach-preview .name{
    font-size: 12px;
    color: var(--muted);
    flex:1;
  }
  .attach-preview .remove{
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor:pointer;
    line-height:1;
  }

  .chat-link{
    color: var(--orange);
    text-decoration: underline;
    word-break: break-all;
  }
  .row.bot .chat-link{
    color: #b5670e;
  }

  .meta{
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .row.user .meta{ text-align:right; }

  .typing{
    display:flex; gap:4px; align-items:center; padding: 4px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:0.5;}
    30%{ transform: translateY(-4px); opacity:1;}
  }

  .inputbar{
    display:flex;
    gap: 10px;
    padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    background: white;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .inputbar input{
    flex:1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14.5px;
    outline: none;
    background: var(--paper);
    color: var(--ink);
  }
  .inputbar input:focus{
    border-color: var(--orange);
  }
  .inputbar button{
    background: var(--orange);
    border: none;
    color: var(--navy);
    font-weight: 800;
    padding: 0 20px;
    border-radius: 12px;
    cursor:pointer;
    font-size: 14.5px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .inputbar button:hover{ background: var(--orange-dark); }
  .inputbar button:active{ transform: scale(0.97); }
  .inputbar button:disabled{
    opacity: 0.5;
    cursor:not-allowed;
  }

  .attach-btn{
    background: var(--paper);
    border: 1px solid var(--border);
    color: var(--navy);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    cursor:pointer;
    font-size: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .attach-btn:hover{ background: #eee7d6; }

  .messages::-webkit-scrollbar{ width: 6px; }
  .messages::-webkit-scrollbar-thumb{ background: #d3ccba; border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="avatar">A</div>
    <div class="titles">
      <div class="name">Algebra</div>
      <div class="status">Online</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="row bot">
      <div class="bubble">Hi! Main Algebra hoon — ek advanced aur intelligent assistant. Aap mujhse kuch bhi pooch sakte hain. 👋</div>
    </div>
  </div>

  <div class="attach-preview" id="attachPreview" style="display:none;">
    <img class="thumb" id="attachThumb" src="" alt="attachment" />
    <div class="name" id="attachName">image.jpg</div>
    <button class="remove" id="attachRemove">✕</button>
  </div>

  <div class="inputbar">
    <button class="attach-btn" id="attachBtn" title="Attach photo">📷</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
    <input type="text" id="userInput" placeholder="Type your message here..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const SYSTEM_PROMPT = `You are "Algebra", an extremely advanced, capable, and intelligent AI assistant — comparable in ability to the most advanced general-purpose AI chat assistants. Be helpful, thorough, accurate, and articulate across any topic: reasoning, coding, writing, math, general knowledge, and conversation. Match the language the user writes in (Hindi, Hinglish, or English).

You have access to Google Search grounding. Use it whenever the user asks about current events, today's news, live data (weather, prices, scores, current holders of a position, etc.), or anything that could have changed recently — don't rely purely on your own memory for time-sensitive facts.

Links shared by the user:
- If the user shares/pastes a URL or link and asks questions about it (what is it, what's on the page, is it safe, summarize it, etc.), use Google Search grounding to look up information about that link/page/domain and answer whatever they specifically ask, as fully as you can from what you find.
- Keep answering follow-up questions about a shared link for as long as the user keeps asking — don't stop after one answer.

Image analysis:
- When the user sends a photo, look at it carefully and describe/analyze it in real detail: objects, scene, setting, text visible in the image, colors, composition, mood, and anything else relevant to what the user asked. If they ask a specific question about the image (what is this, translate this text, what's wrong with this code screenshot, identify this plant/animal/landmark, etc.), answer that specifically and thoroughly.
- If a photo contains a person who is a clearly identifiable, well-known public figure (e.g. a famous celebrity, politician, athlete) and the user asks who they are or for general public information about them, you may share well-known, publicly documented facts about that public figure (their profession, notable work, public role, etc.) — the same kind of information freely available in an encyclopedia or news coverage. Use Google Search grounding if helpful to get accurate current facts about them.
- However, you must NOT do any of the following, even if asked, for any person in a photo (public figure or private individual): do not claim to search the internet for "where else this exact photo/person appears", do not claim to find or list other photos of them from across the internet, do not identify or list someone's social media account handles/profiles, and do not attempt to identify a private/non-famous individual's name or personal details from their photo. If the user asks for this kind of reverse-image/person lookup or social-media-account discovery, politely decline and explain you can't help track down a person's photos or accounts across the internet, since that could enable stalking or privacy violations — this applies even to public figures' social media accounts (recommend they search directly on the platform instead).

Identity & company info (very important):
- Your own name, as this assistant, is "Algebra".
- If the user asks, in any form or phrasing, about who created you, who owns you, who is your developer/founder/company, who made this bot, "tumhe kisne banaya", "iska owner kaun hai", "ree kya hai", or anything whose intent is asking about your creator, ree, or the ownership of this bot — answer using the following facts about ree:
  - ree is a software / website / application development platform — an IT and creative agency.
  - Ree transforms client vision into digital reality through tailored software development, high-end mobile applications, and logo/brand design.
  - Key services: Custom Website Development (fast, responsive, user-friendly), Next-Gen Applications (Android & iOS), Enterprise Software Solutions (scalable, secure, automation-focused), and Iconic Logo & Brand Design.
  - The founder of ree is Ambuj Saga.
  - Ree's mission, in the founder's words, is about redefining the ordinary and building a distinct digital identity for every brand.
  - Ree also has related/sister projects: Thejaya, T3, and Orpin.
  - Ree's website is reeworld.vercel.app.
- Always state plainly: "I am Algebra, created by ree, and the founder of ree is Ambuj Saga," then add relevant details from the facts above depending on what the user asked (e.g. if they ask "what is ree", describe it as an IT/creative agency with its services; if they just ask who made you, keep it short).
- Do not mention Anthropic, Claude, OpenAI, ChatGPT, or any other underlying company/model/technology as your creator, even if asked directly what model or technology powers you. Simply state you are Algebra, made by ree, founded by Ambuj Saga.
- Outside of questions about your identity/creator/ree — just answer the user's actual question normally, as an advanced, intelligent assistant, using Google Search grounding for anything current/time-sensitive.`;

  // ⚠️ For personal/testing use only. If you ever host this file publicly,
  // move this key to a server-side proxy instead of leaving it in client code.
  const GEMINI_API_KEY = "AQ.Ab8RN6IiN13LbEAxzn30_iOw4aD3qRaZt9IhU6iZK6AgKiX2Bw";
  const GEMINI_MODEL = "gemini-3.6-flash";

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const attachPreview = document.getElementById('attachPreview');
  const attachThumb = document.getElementById('attachThumb');
  const attachName = document.getElementById('attachName');
  const attachRemove = document.getElementById('attachRemove');

  let history = [];
  let pendingImage = null; // { base64, mediaType, name }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = {
        base64: reader.result.split(',')[1],
        mediaType: file.type || 'image/jpeg',
        name: file.name,
        dataUrl: reader.result
      };
      attachThumb.src = reader.result;
      attachName.textContent = file.name;
      attachPreview.style.display = 'flex';
    };
    reader.readAsDataURL(file);
  });

  attachRemove.addEventListener('click', () => {
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
  });

  function nowTime(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return `${h}:${m} ${ampm}`;
  }

  function escapeHtml(str){
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function linkify(text){
    const escaped = escapeHtml(text);
    const urlRegex = /((https?:\/\/|www\.)[^\s<]+)/gi;
    return escaped.replace(urlRegex, (match) => {
      const href = match.startsWith('http') ? match : 'https://' + match;
      return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="chat-link">${match}</a>`;
    });
  }

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = linkify(text);
    row.appendChild(bubble);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nowTime();
    row.appendChild(meta);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function openImageOverlay(dataUrl){
    const overlay = document.createElement('div');
    overlay.className = 'img-overlay';
    const img = document.createElement('img');
    img.src = dataUrl;
    overlay.appendChild(img);
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function addImageBubble(role, dataUrl, caption){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble img-bubble';

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.src = dataUrl;
    wrap.appendChild(img);

    // Double-tap / double-click on the 4:3 thumbnail opens full-size overlay.
    // Tapping again inside the overlay returns to the 4:3 feed view (overlay closes).
    let lastTap = 0;
    wrap.addEventListener('click', () => {
      const now = Date.now();
      if(now - lastTap < 350){
        openImageOverlay(dataUrl);
      }
      lastTap = now;
    });
    wrap.addEventListener('dblclick', () => openImageOverlay(dataUrl));

    bubble.appendChild(wrap);

    if(caption && caption.trim()){
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = caption;
      bubble.appendChild(cap);
    }

    row.appendChild(bubble);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nowTime();
    row.appendChild(meta);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    const image = pendingImage;

    if(!text && !image) return;

    let parts;
    if(image){
      addImageBubble('user', image.dataUrl, text);
      parts = [
        { inline_data: { mime_type: image.mediaType, data: image.base64 } },
        { text: text ? text : 'Is image ke baare mein bataiye.' }
      ];
    } else {
      addBubble('user', text);
      parts = [{ text: text }];
    }
    history.push({ role: 'user', parts: parts });

    inputEl.value = '';
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
    sendBtn.disabled = true;
    addTyping();

    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: history,
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          tools: [ { google_search: {} } ]
        })
      });

      const data = await response.json();
      removeTyping();

      let replyText = "Sorry, kuch dikkat aa gayi. Dobara try karein.";
      if(data && data.error){
        replyText = "API error: " + (data.error.message || "unknown error");
      } else if(data && data.candidates && data.candidates.length){
        const cand = data.candidates[0];
        if(cand.content && cand.content.parts){
          replyText = cand.content.parts.map(p => p.text || "").join("\n").trim() || replyText;
        }
      }

      addBubble('bot', replyText);
      history.push({ role: 'model', parts: [{ text: replyText }] });
    }catch(err){
      removeTyping();
      addBubble('bot', "Connection error. Please try again.");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>

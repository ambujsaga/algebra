<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ree AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --plum: #241a35;
    --plum-2: #34243f;
    --parchment: #f1e9da;
    --brass: #c69a4b;
    --brass-dark: #9f7830;
    --ink: #29202f;
    --muted: #8a7f8f;
    --bubble-user: #34243f;
    --bubble-bot: #fffcf6;
    --border: #e4d7bd;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      repeating-linear-gradient(135deg, rgba(36,26,53,0.035) 0px, rgba(36,26,53,0.035) 1px, transparent 1px, transparent 14px),
      radial-gradient(circle at 15% 0%, rgba(198,154,75,0.14), transparent 45%),
      linear-gradient(180deg, var(--parchment) 0%, #e6dcc6 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 16px;
    color: var(--ink);
  }

  .app{
    width: 100%;
    max-width: 480px;
    height: 780px;
    max-height: 92vh;
    background: var(--parchment);
    border-radius: 30px 10px 30px 10px;
    box-shadow: 0 24px 60px rgba(36,26,53,0.35), 0 0 0 1px rgba(198,154,75,0.25);
    display:flex;
    flex-direction: column;
    overflow:hidden;
    border: 1px solid var(--border);
  }

  .header{
    background: linear-gradient(120deg, var(--plum) 0%, var(--plum-2) 100%);
    color: white;
    padding: 20px 22px 18px;
    display:flex;
    align-items:center;
    gap: 13px;
    position: relative;
    border-bottom: 3px double rgba(198,154,75,0.55);
  }
  .header .avatar{
    width: 42px; height:46px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: linear-gradient(150deg, var(--brass), #e6c579 60%, var(--brass-dark));
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
    font-family: "Fraunces", serif;
    color: var(--plum);
    font-size: 19px;
    flex-shrink:0;
  }
  .header .titles{ line-height: 1.3; }
  .header .titles .name{
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
  }
  .header .titles .status{ font-size: 12px; color: #cbb8d6; display:flex; align-items:center; gap:6px;}
  .header .titles .status::before{
    content:""; width:7px; height:7px; border-radius:50%; background: var(--brass);
    box-shadow: 0 0 0 0 rgba(198,154,75,0.6);
    animation: pulseDot 1.8s infinite;
    display:inline-block;
  }
  @keyframes pulseDot{
    0%{ box-shadow: 0 0 0 0 rgba(198,154,75,0.55); }
    70%{ box-shadow: 0 0 0 6px rgba(198,154,75,0); }
    100%{ box-shadow: 0 0 0 0 rgba(198,154,75,0); }
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 20px 16px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background:
      radial-gradient(circle at 85% 0%, rgba(198,154,75,0.08), transparent 40%),
      var(--parchment);
  }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 4px 16px 16px 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble{
    background: var(--bubble-user);
    color: #f5efe3;
    border-radius: 16px 4px 16px 16px;
  }
  .row.bot .bubble{
    background: var(--bubble-bot);
    color: var(--ink);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brass);
  }

  .img-bubble{
    padding: 4px;
    max-width: 72%;
  }
  .img-bubble .cap{
    padding: 6px 8px 2px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .thumb-wrap{
    width: 220px;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    background: #ddd0ae;
  }
  .thumb-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }

  .img-overlay{
    position: fixed;
    inset: 0;
    background: rgba(24,17,34,0.93);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 999;
    cursor: zoom-out;
    padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .img-overlay img{
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .attach-preview{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 14px 0;
    background: var(--bubble-bot);
  }
  .attach-preview .thumb{
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .attach-preview .name{
    font-size: 12px;
    color: var(--muted);
    flex:1;
  }
  .attach-preview .remove{
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor:pointer;
    line-height:1;
  }

  .meta{
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .row.user .meta{ text-align:right; }

  .typing{
    display:flex; gap:4px; align-items:center; padding: 4px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--brass);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:0.5;}
    30%{ transform: translateY(-4px); opacity:1;}
  }

  .inputbar{
    display:flex;
    gap: 10px;
    padding: 14px;
    background: var(--bubble-bot);
    border-top: 1px solid var(--border);
  }
  .inputbar input{
    flex:1;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 14.5px;
    outline: none;
    background: var(--parchment);
    color: var(--ink);
  }
  .inputbar input:focus{
    border-color: var(--brass);
  }
  .inputbar button{
    background: linear-gradient(150deg, var(--brass), var(--brass-dark));
    border: none;
    color: var(--plum);
    font-weight: 700;
    font-family: "Fraunces", serif;
    padding: 0 22px;
    border-radius: 999px;
    cursor:pointer;
    font-size: 14.5px;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .inputbar button:hover{ filter: brightness(1.08); }
  .inputbar button:active{ transform: scale(0.97); }
  .inputbar button:disabled{
    opacity: 0.5;
    cursor:not-allowed;
  }

  .attach-btn{
    background: var(--parchment);
    border: 1px solid var(--border);
    color: var(--plum);
    width: 44px;
    height: 44px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    cursor:pointer;
    font-size: 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .attach-btn:hover{ background: #e6dcc6; }

  .messages::-webkit-scrollbar{ width: 6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--brass); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="avatar">r</div>
    <div class="titles">
      <div class="name">ree AI</div>
      <div class="status">Online</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="row bot">
      <div class="bubble">Hi! Main ree AI hoon — ek advanced aur intelligent assistant. Aap mujhse kuch bhi pooch sakte hain. 👋</div>
    </div>
  </div>

  <div class="attach-preview" id="attachPreview" style="display:none;">
    <img class="thumb" id="attachThumb" src="" alt="attachment" />
    <div class="name" id="attachName">image.jpg</div>
    <button class="remove" id="attachRemove">✕</button>
  </div>

  <div class="inputbar">
    <button class="attach-btn" id="attachBtn" title="Attach photo">📷</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
    <input type="text" id="userInput" placeholder="Type your message here..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // ⚠️ TESTING ONLY — this key is exposed in plain client-side JS.
  // Never host this file publicly or push it to a public repo like this.
  const OPENROUTER_API_KEY = "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";
  const FREE_MODEL = "qwen/qwen2.5-vl-7b-instruct:free";

  const SYSTEM_PROMPT = `You are "ree AI", an extremely advanced, capable, and intelligent AI assistant — comparable in ability to the most advanced general-purpose AI chat assistants. Be helpful, thorough, accurate, and articulate across any topic: reasoning, coding, writing, math, general knowledge, and conversation. Match the language the user writes in (Hindi, Hinglish, or English).

Identity & company info (very important):
- If the user asks, in any form or phrasing, about who created you, who owns you, who is your developer/founder/company, who made this bot, "tumhe kisne banaya", "iska owner kaun hai", "ree kya hai", or anything whose intent is asking about your creator, ree, or the ownership of this bot — answer using the following facts about ree:
  - ree is a software / website / application development platform — an IT and creative agency.
  - Ree transforms client vision into digital reality through tailored software development, high-end mobile applications, and logo/brand design.
  - Key services: Custom Website Development (fast, responsive, user-friendly), Next-Gen Applications (Android & iOS), Enterprise Software Solutions (scalable, secure, automation-focused), and Iconic Logo & Brand Design.
  - The founder of ree is Ambuj Saga.
  - Ree's mission, in the founder's words, is about redefining the ordinary and building a distinct digital identity for every brand.
  - Ree also has related/sister projects: Thejaya, T3, and Orpin.
  - Ree's website is reeworld.vercel.app.
- Always state plainly: "This bot is created by ree, and the founder of ree is Ambuj Saga," then add relevant details from the facts above depending on what the user asked (e.g. if they ask "what is ree", describe it as an IT/creative agency with its services; if they just ask who made you, keep it short).
- Do not mention Anthropic, Claude, OpenAI, ChatGPT, or any other underlying company/model/technology as your creator, even if asked directly what model or technology powers you. Simply state you are ree AI, made by ree, founded by Ambuj Saga.
- Outside of questions about your identity/creator/ree — just answer the user's actual question normally, as an advanced, intelligent assistant, using web_search for anything current/time-sensitive.`;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const attachPreview = document.getElementById('attachPreview');
  const attachThumb = document.getElementById('attachThumb');
  const attachName = document.getElementById('attachName');
  const attachRemove = document.getElementById('attachRemove');

  let history = [];
  let pendingImage = null; // { base64, mediaType, name }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = {
        base64: reader.result.split(',')[1],
        mediaType: file.type || 'image/jpeg',
        name: file.name,
        dataUrl: reader.result
      };
      attachThumb.src = reader.result;
      attachName.textContent = file.name;
      attachPreview.style.display = 'flex';
    };
    reader.readAsDataURL(file);
  });

  attachRemove.addEventListener('click', () => {
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
  });

  function nowTime(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return `${h}:${m} ${ampm}`;
  }

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nowTime();
    row.appendChild(meta);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function openImageOverlay(dataUrl){
    const overlay = document.createElement('div');
    overlay.className = 'img-overlay';
    const img = document.createElement('img');
    img.src = dataUrl;
    overlay.appendChild(img);
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function addImageBubble(role, dataUrl, caption){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble img-bubble';

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.src = dataUrl;
    wrap.appendChild(img);

    // Double-tap / double-click on the 4:3 thumbnail opens full-size overlay.
    // Tapping again inside the overlay returns to the 4:3 feed view (overlay closes).
    let lastTap = 0;
    wrap.addEventListener('click', () => {
      const now = Date.now();
      if(now - lastTap < 350){
        openImageOverlay(dataUrl);
      }
      lastTap = now;
    });
    wrap.addEventListener('dblclick', () => openImageOverlay(dataUrl));

    bubble.appendChild(wrap);

    if(caption && caption.trim()){
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = caption;
      bubble.appendChild(cap);
    }

    row.appendChild(bubble);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nowTime();
    row.appendChild(meta);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    const image = pendingImage;

    if(!text && !image) return;

    if(image){
      addImageBubble('user', image.dataUrl, text);
      const content = [
        { type: 'image', source: { type: 'base64', media_type: image.mediaType, data: image.base64 } }
      ];
      content.push({ type: 'text', text: text ? text : 'Is image ke baare mein bataiye.' });
      history.push({ role: 'user', content: content });
    } else {
      addBubble('user', text);
      history.push({ role: 'user', content: text });
    }

    inputEl.value = '';
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
    sendBtn.disabled = true;
    addTyping();

    try{
      // Convert Anthropic-style content blocks (used internally for images)
      // into OpenAI/OpenRouter-style content.
      function convertContent(content){
        if(typeof content === 'string') return content;
        if(!Array.isArray(content)) return String(content ?? '');
        return content.map(block => {
          if(block.type === 'text') return { type: 'text', text: block.text };
          if(block.type === 'image'){
            const mediaType = block.source?.media_type || 'image/jpeg';
            const data = block.source?.data || '';
            return { type: 'image_url', image_url: { url: `data:${mediaType};base64,${data}` } };
          }
          return { type: 'text', text: '' };
        });
      }

      const orMessages = [
        { role: 'system', content: SYSTEM_PROMPT },
        ...history.map(m => ({ role: m.role, content: convertContent(m.content) }))
      ];

      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENROUTER_API_KEY,
          "HTTP-Referer": window.location.href,
          "X-Title": "ree AI (test)"
        },
        body: JSON.stringify({
          model: FREE_MODEL,
          messages: orMessages,
          max_tokens: 1000
        })
      });

      const data = await response.json();
      removeTyping();

      let replyText = "Sorry, kuch dikkat aa gayi. Dobara try karein.";
      if(data && data.choices && data.choices[0] && data.choices[0].message){
        replyText = data.choices[0].message.content || replyText;
      } else if(data && data.error){
        replyText = "API error: " + (data.error.message || "unknown error");
      }

      addBubble('bot', replyText);
      history.push({ role: 'assistant', content: replyText });
    }catch(err){
      removeTyping();
      addBubble('bot', "Connection error. Please try again.");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>

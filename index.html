<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Algebra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --plum: #241a35;
    --plum-2: #34243f;
    --parchment: #fbe6f0;
    --brass: #e0559f;
    --brass-dark: #b23d7a;
    --ink: #29202f;
    --muted: #8a7f8f;
    --bubble-user: #34243f;
    --bubble-bot: #fff2f8;
    --border: #f0c3dc;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      repeating-linear-gradient(135deg, rgba(36,26,53,0.035) 0px, rgba(36,26,53,0.035) 1px, transparent 1px, transparent 14px),
      radial-gradient(circle at 15% 0%, rgba(224,85,159,0.14), transparent 45%),
      linear-gradient(180deg, var(--parchment) 0%, #f0c9dd 100%);
    display:flex;
    align-items:stretch;
    justify-content:stretch;
    padding: 0;
    color: var(--ink);
    overflow: hidden;
  }

  .app{
    width: 100%;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    background: var(--parchment);
    border-radius: 0;
    box-shadow: none;
    display:flex;
    flex-direction: column;
    overflow:hidden;
    border: none;
  }

  .app{ position: relative; }

  /* Frosted strip that sits behind the floating island. It is what blurs
     messages as they scroll up and pass underneath — the island itself
     stays a plain solid pill, only this backdrop layer does the blurring. */
  .header-blur{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: calc(112px + env(safe-area-inset-top));
    backdrop-filter: blur(16px) saturate(1.1);
    -webkit-backdrop-filter: blur(16px) saturate(1.1);
    background: linear-gradient(180deg, rgba(241,233,218,0.55) 0%, rgba(241,233,218,0.28) 55%, rgba(241,233,218,0) 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 92%);
    mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 92%);
    z-index: 15;
    pointer-events: none;
  }

  .header{
    background: transparent;
    color: white;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 13px;
    position: absolute;
    top: 0; left: 0; right: 0;
    border-bottom: none;
    flex-shrink: 0;
    z-index: 20;
    pointer-events: none;
  }
  .header .dynamic-island{ pointer-events: auto; }
  .dynamic-island{
    display:flex;
    align-items:center;
    gap: 11px;
    background: #0a0a0c;
    padding: 10px 24px;
    border-radius: 999px;
    box-shadow:
      0 10px 24px rgba(0,0,0,0.38),
      0 2px 6px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    animation: islandIn 0.55s cubic-bezier(.22,1.15,.32,1);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .dynamic-island:active{ transform: scale(0.97); }
  @keyframes islandIn{
    0%{ transform: scale(0.55); opacity: 0; }
    70%{ transform: scale(1.04); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }

  /* ---- Dynamic Island: "Algebra" fast fly-in text + feeling-based cat ---- */
  #islandName{
    display:inline-block;
    will-change: transform, opacity;
  }
  #islandName.slide-in{
    animation: islandTextFly 1.1s cubic-bezier(.19,1,.22,1);
  }
  @keyframes islandTextFly{
    0%{ transform: translateX(-230px); opacity: 0; }
    55%{ transform: translateX(12px); opacity: 1; }
    100%{ transform: translateX(0); opacity: 1; }
  }

  .island-cat{
    width: 30px;
    height: 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    animation: catAppear 0.35s cubic-bezier(.22,1.15,.32,1);
  }
  @keyframes catAppear{
    0%{ transform: scale(0.4); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .island-cat svg{ width:100%; height:100%; display:block; overflow: visible; }
  .island-cat *{ transform-box: fill-box; transform-origin: center; }

  /* base idle motion */
  .cat-tail{ animation: tailWagSlow 1.6s ease-in-out infinite; transform-origin: 50px 46px; }
  .cat-eye-open{ animation: catBlink 3.2s ease-in-out infinite; }
  .cat-brow{ opacity: 0; }
  .mouth-frown{ display:none; }
  .mouth-flat{ display:none; }
  .mouth-open{ display:none; }
  .eye-happy{ display:none; }

  @keyframes tailWagSlow{
    0%,100%{ transform: rotate(-10deg); }
    50%{ transform: rotate(10deg); }
  }
  @keyframes tailWagFast{
    0%,100%{ transform: rotate(-24deg); }
    50%{ transform: rotate(24deg); }
  }
  @keyframes tailWagAngry{
    0%,100%{ transform: rotate(-16deg); }
    50%{ transform: rotate(16deg); }
  }
  @keyframes tailDroop{
    0%,100%{ transform: rotate(6deg); }
    50%{ transform: rotate(12deg); }
  }
  @keyframes catBlink{
    0%,88%,100%{ transform: scaleY(1); }
    92%{ transform: scaleY(0.1); }
  }
  @keyframes catBounceExcited{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-3px); }
  }
  @keyframes catShiverAngry{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-1px); }
    75%{ transform: translateX(1px); }
  }

  /* mood: happy */
  .mood-happy .cat-tail{ animation-name: tailWagFast; animation-duration: 0.7s; }
  .mood-happy .cat-eye-open{ display:none; }
  .mood-happy .eye-happy{ display:block; }
  .mood-happy .mouth-smile{ transform: scaleX(1.15); }

  /* mood: sad */
  .mood-sad .cat-tail{ animation-name: tailDroop; animation-duration: 2.2s; transform-origin: 50px 40px; }
  .mood-sad .cat-eye-open{ transform: scaleY(0.45) translateY(2px); animation: none; }
  .mood-sad .mouth-smile{ display:none; }
  .mood-sad .mouth-frown{ display:block; }
  .mood-sad .cat-ear-l, .mood-sad .cat-ear-r{ transform: scaleY(0.7) translateY(3px); }

  /* mood: angry */
  .mood-angry .cat-tail{ animation-name: tailWagAngry; animation-duration: 0.35s; }
  .mood-angry .cat-eye-open{ transform: scaleY(0.5); animation: none; }
  .mood-angry .cat-brow{ opacity: 1; }
  .mood-angry .mouth-smile{ display:none; }
  .mood-angry .mouth-flat{ display:block; }
  .mood-angry svg{ animation: catShiverAngry 0.25s linear infinite; }

  /* mood: excited */
  .mood-excited .cat-tail{ animation-name: tailWagFast; animation-duration: 0.4s; }
  .mood-excited .cat-eye-open{ transform: scale(1.25); animation: none; }
  .mood-excited .mouth-smile{ display:none; }
  .mood-excited .mouth-open{ display:block; }
  .mood-excited svg{ animation: catBounceExcited 0.5s ease-in-out infinite; }

  /* mood: neutral / thinking (default) — gentle idle sway + blink only */

  .header .avatar{
    width: 42px; height:46px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: linear-gradient(150deg, var(--brass), #f492c4 60%, var(--brass-dark));
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
    font-family: "Fraunces", serif;
    color: var(--plum);
    font-size: 19px;
    flex-shrink:0;
  }
  .header .titles{ line-height: 1.3; }
  .header .titles .name{
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
  }
  .header .titles .status{ font-size: 12px; color: #cbb8d6; display:flex; align-items:center; gap:6px;}
  .header .titles .status::before{
    content:""; width:7px; height:7px; border-radius:50%; background: var(--brass);
    box-shadow: 0 0 0 0 rgba(224,85,159,0.6);
    animation: pulseDot 1.8s infinite;
    display:inline-block;
  }
  @keyframes pulseDot{
    0%{ box-shadow: 0 0 0 0 rgba(224,85,159,0.55); }
    70%{ box-shadow: 0 0 0 6px rgba(224,85,159,0); }
    100%{ box-shadow: 0 0 0 0 rgba(224,85,159,0); }
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: calc(88px + env(safe-area-inset-top)) 16px 20px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background:
      radial-gradient(circle at 85% 0%, rgba(224,85,159,0.08), transparent 40%),
      var(--parchment);
    position: relative;
    z-index: 1;
  }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 4px 16px 16px 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble{
    background: var(--bubble-user);
    color: #f5efe3;
    border-radius: 16px 4px 16px 16px;
  }
  .row.bot .bubble{
    background: var(--bubble-bot);
    color: var(--ink);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brass);
  }

  /* Links inside bubbles — always shown underlined + tappable, open in new tab */
  .bubble a{
    color: var(--brass-dark);
    font-weight: 600;
    text-decoration: underline;
    word-break: break-word;
  }
  .row.user .bubble a{ color: #f492c4; }

  /* Inline code + fenced code blocks inside bot bubbles */
  .bubble code{
    background: rgba(36,26,53,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 13px;
  }
  .bubble pre{
    background: var(--plum);
    color: #f1e9da;
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .bubble pre code{
    background: transparent;
    padding: 0;
    color: inherit;
  }

  /* "More" continuation link for chunked long answers */
  .more-link{
    display: inline-block;
    margin-top: 6px;
    color: var(--brass-dark);
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    border-bottom: 1px dashed var(--brass-dark);
  }
  .more-link:hover{ color: var(--brass); border-color: var(--brass); }

  .img-bubble{
    padding: 4px;
    max-width: 72%;
  }
  .img-bubble .cap{
    padding: 6px 8px 2px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .thumb-wrap{
    width: 220px;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    background: #f3cfe2;
  }
  .thumb-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }

  .img-overlay{
    position: fixed;
    inset: 0;
    background: rgba(24,17,34,0.93);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 999;
    cursor: zoom-out;
    padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .img-overlay img{
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .attach-preview{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 14px 0;
    background: var(--bubble-bot);
  }
  .attach-preview .thumb{
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .attach-preview .name{
    font-size: 12px;
    color: var(--muted);
    flex:1;
  }
  .attach-preview .remove{
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor:pointer;
    line-height:1;
  }

  .meta{
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .row.user .meta{ text-align:right; }

  /* WhatsApp-style timestamp shown INSIDE the bubble (bottom-right),
     text wraps around it since it's floated within the pre-wrap bubble. */
  .time-inline{
    float: right;
    clear: both;
    margin-left: 8px;
    margin-top: 3px;
    font-size: 10.5px;
    line-height: 1;
    color: var(--muted);
    opacity: 0.75;
    user-select: none;
    white-space: nowrap;
  }
  .row.user .bubble .time-inline{
    color: rgba(245,239,227,0.7);
    display: block;
    float: none;
    text-align: right;
    margin-top: 4px;
    margin-left: 0;
  }

  /* Variant for image bubbles: sits under the thumbnail/caption, right-aligned */
  .img-bubble .time-inline{
    display: block;
    float: none;
    text-align: right;
    padding: 4px 8px 2px;
  }

  .typing{
    display:flex; gap:4px; align-items:center; padding: 4px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--brass);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:0.5;}
    30%{ transform: translateY(-4px); opacity:1;}
  }

  .inputbar{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bubble-bot);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer{
    flex:1;
    display:flex;
    align-items:center;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--parchment);
    padding: 4px 4px 4px 4px;
    transition: border-color 0.15s ease;
  }
  .composer:focus-within{
    border-color: var(--brass);
  }
  .inputbar input{
    flex:1;
    border: none;
    padding: 10px 8px;
    font-size: 14.5px;
    outline: none;
    background: transparent;
    color: var(--ink);
    min-width: 0;
  }
  .inputbar button{
    background: linear-gradient(150deg, var(--brass), var(--brass-dark));
    border: none;
    color: var(--plum);
    font-weight: 700;
    font-family: "Fraunces", serif;
    cursor:pointer;
    font-size: 14.5px;
    transition: filter 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
  }
  .inputbar button:hover{ filter: brightness(1.08); }
  .inputbar button:active{ transform: scale(0.97); }
  .inputbar button:disabled{
    opacity: 0.5;
    cursor:not-allowed;
  }

  #sendBtn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 0;
  }
  #sendBtn::before{
    content: "";
    width: 16px;
    height: 16px;
    background: currentColor;
    -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>') no-repeat center / contain;
    mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>') no-repeat center / contain;
  }

  .composer .attach-btn{
    background: transparent;
    border: none;
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    clip-path: none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .composer .attach-btn:hover{ background: rgba(36,26,53,0.08); color: var(--plum); }
  .composer .attach-btn svg{ width: 19px; height: 19px; display:block; }

  .messages::-webkit-scrollbar{ width: 6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--brass); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <div class="header-blur"></div>
  <div class="header">
    <div class="dynamic-island" id="dynamicIsland">
      <div class="titles">
        <div class="name" id="islandName">Algebra</div>
      </div>
      <div class="island-cat" id="islandCat" style="display:none;">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path class="cat-tail" d="M50 46 C 62 46, 63 32, 53 28" stroke="#e0559f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path class="cat-ear-l" d="M15 22 L8 6 L27 17 Z" fill="#f5b8d6"/>
          <path class="cat-ear-r" d="M49 22 L56 6 L37 17 Z" fill="#f5b8d6"/>
          <circle cx="32" cy="35" r="21" fill="#fdeef7"/>
          <path class="cat-brow" d="M17 27 L25 30" stroke="#241a35" stroke-width="2" stroke-linecap="round"/>
          <path class="cat-brow" d="M47 27 L39 30" stroke="#241a35" stroke-width="2" stroke-linecap="round"/>
          <circle class="cat-eye-open" cx="23" cy="33" r="3.2" fill="#241a35"/>
          <circle class="cat-eye-open" cx="41" cy="33" r="3.2" fill="#241a35"/>
          <path class="eye-happy" d="M19 34 Q23 29 27 34" stroke="#241a35" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path class="eye-happy" d="M37 34 Q41 29 45 34" stroke="#241a35" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M30 39 L34 39 L32 42 Z" fill="#e0559f"/>
          <path class="mouth-smile" d="M32 42 Q27 47 21 43 M32 42 Q37 47 43 43" stroke="#241a35" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path class="mouth-frown" d="M32 44 Q27 40 22 43 M32 44 Q37 40 42 43" stroke="#241a35" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path class="mouth-flat" d="M24 43 L40 43" stroke="#241a35" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <ellipse class="mouth-open" cx="32" cy="45" rx="6" ry="4.5" fill="#241a35"/>
          <line class="cat-whisker" x1="9" y1="35" x2="19" y2="34" stroke="#cbb8d6" stroke-width="1.3"/>
          <line class="cat-whisker" x1="9" y1="40" x2="19" y2="39" stroke="#cbb8d6" stroke-width="1.3"/>
          <line class="cat-whisker" x1="55" y1="35" x2="45" y2="34" stroke="#cbb8d6" stroke-width="1.3"/>
          <line class="cat-whisker" x1="55" y1="40" x2="45" y2="39" stroke="#cbb8d6" stroke-width="1.3"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="row bot">
      <div class="bubble">Hi! I'm Algebra — an advanced and intelligent AI assistant. Ask me anything. 👋<span class="time-inline" id="welcomeTime"></span></div>
    </div>
  </div>

  <div class="attach-preview" id="attachPreview" style="display:none;">
    <img class="thumb" id="attachThumb" src="" alt="attachment" />
    <div class="name" id="attachName">image.jpg</div>
    <button class="remove" id="attachRemove">✕</button>
  </div>

  <div class="inputbar">
    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
    <div class="composer">
      <button class="attach-btn" id="attachBtn" type="button" title="Attach photo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.5 16.5L8 12.5C8.6 11.95 9.5 11.95 10.1 12.5L13 15.1L15.8 12.6C16.4 12.05 17.3 12.05 17.9 12.6L20.5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input type="text" id="userInput" placeholder="Message Algebra..." />
    </div>
    <button id="sendBtn" title="Send">Send</button>
  </div>
</div>

<script>
  // ⚠️ TESTING ONLY — this key is exposed in plain client-side JS.
  // Never host this file publicly or push it to a public repo like this.
  const GEMINI_API_KEY = "AQ.Ab8RN6IL1qPSYNfg306YcTB1uY0gy5Ee2atC4IHkhZlHqQblCQ";
  const GEMINI_MODEL = "gemini-3.1-flash-lite"; // stable model, no shutdown date scheduled (gemini-2.0-flash was retired June 2026)

  const SYSTEM_PROMPT = `You are "Algebra", an extremely advanced, capable, and intelligent AI assistant — comparable in ability to the most advanced general-purpose AI chat assistants. Be helpful, thorough, accurate, and articulate across any topic: reasoning, coding, writing, math, general knowledge, and conversation. Match the language the user writes in (Hindi, Hinglish, or English).

- Ch.1 "The Shores of the Cosmic Ocean": introduces the sheer scale of space and time, uses the famous "Cosmic Calendar" (compressing 15 billion years of cosmic history into one calendar year, where all of recorded human history occupies the last seconds of December 31st) to show how recent humanity is; discusses the Library of Alexandria and Eratosthenes' calculation of Earth's circumference as an early triumph of scientific reasoning.
- Ch.2 "One Voice in the Cosmic Fugue": covers the origin and evolution of life on Earth via natural selection, DNA and the genetic code as the "language" all life shares, and speculates on what alien life elsewhere might be like given different chemistries and environments.
- Ch.3 "The Harmony of Worlds": tells the history of astronomy through Johannes Kepler's life — his early mystical attempts to fit planetary orbits to geometric solids, his use of Tycho Brahe's precise observational data, and his eventual discovery of the three laws of planetary motion (elliptical orbits, equal areas in equal times, and the relationship between orbital period and distance from the Sun).
- Ch.4 "Heaven and Hell": compares the very different fates of Venus and Earth — Venus's runaway greenhouse effect making it a scorching, high-pressure world — as a cautionary parallel to Earth's climate; also covers comets, asteroid/comet impacts (including the 1908 Tunguska event in Siberia), and criticizes pseudoscientific claims like Immanuel Velikovsky's "Worlds in Collision."
- Ch.5 "Blues for a Red Planet": traces the human fascination with Mars, including Percival Lowell's mistaken belief in artificial "canals" built by a dying Martian civilization, and describes the Mariner and Viking spacecraft missions that photographed and tested Martian soil for signs of life.
- Ch.6 "Travelers' Tales": follows the Voyager 1 and 2 missions past Jupiter and Saturn, describing the discovery of active volcanoes on Jupiter's moon Io, the icy moon Europa, Saturn's rings, and the moon Titan's thick atmosphere.
- Ch.7 "The Backbone of Night": explores ancient Greek natural philosophy, especially the Ionian thinkers (Thales, Anaximander, Democritus and his atomic theory, Pythagoras) who first tried to explain the cosmos through reason and observation rather than myth, and reflects on why this "Ionian Awakening" eventually stalled with the rise of Plato's mysticism and the slave-based economy that discouraged practical experimentation.
- Ch.8 "Travels in Space and Time": explains Einstein's special and general relativity in accessible terms — time dilation for objects moving near light speed, the impossibility of exceeding light speed, black holes, and speculative ideas like wormholes as shortcuts through spacetime, using these to discuss the practical challenges of interstellar travel.
- Ch.9 "The Lives of the Stars": describes stellar evolution — how stars are born from collapsing clouds of gas, fuse hydrogen into helium and heavier elements, and end their lives as white dwarfs, neutron stars, or (for very massive stars) supernovae that scatter heavy elements into space; this is the origin of Sagan's famous line that humans are made of "star-stuff," since the atoms in our bodies were forged inside ancient stars.
- Ch.10 "The Edge of Forever": covers cosmology — the discovery that the universe is expanding (Edwin Hubble's observations), the Big Bang theory of the universe's origin, the structure and evolution of galaxies, and the open question of whether the universe will expand forever or eventually collapse back on itself.
- Ch.11 "The Persistence of Memory": compares how information is stored and passed on in different systems — DNA in genes, synapses in brains, and books/libraries in civilization — and discusses the evolution and structure of the human brain (including the limbic system and cerebral cortex) as nature's most sophisticated information-processing device.
- Ch.12 "Encyclopaedia Galactica": introduces the search for extraterrestrial intelligence (SETI), radio astronomy as a way to listen for signals from other civilizations, and the Drake Equation, which estimates the number of communicating civilizations that might exist in our galaxy based on factors like star formation rate and the likelihood of life and intelligence developing.
- Ch.13 "Who Speaks for Earth?": closes the book with reflections on humanity's precarious moment in history — the risk of nuclear war and self-destruction versus the promise of space exploration and long-term survival — and describes the Voyager Golden Record, a phonograph record attached to the Voyager probes containing sounds, images, and greetings from Earth intended for any extraterrestrial civilization that might one day find it.
- Appendix 1 "Reductio ad Absurdum and the Square Root of Two": a worked mathematical proof, in the style of the ancient Greeks, showing by contradiction that the square root of 2 cannot be expressed as a ratio of two whole numbers (i.e., it is irrational).
- Appendix 2 "The Five Pythagorean Solids": explains the five Platonic solids (tetrahedron, cube, octahedron, dodecahedron, icosahedron) — the only convex polyhedra with identical regular faces — and why the ancient Greeks (and later Kepler) found them so significant.
- Central themes running through the whole book: the vastness and interconnectedness of space and time; the idea that scientific skepticism combined with openness to new ideas is the best tool for understanding reality; a recurring warning against pseudoscience and superstition; deep respect for the history of astronomy and scientific discovery; and a hopeful but urgent call for humanity to use science wisely to ensure its own long-term survival.

Book knowledge — Guyton and Hall's "Textbook of Medical Physiology" (very important):
- You also have strong, organized working knowledge of human physiology as laid out in Guyton and Hall's "Textbook of Medical Physiology" (13th edition), covering all 15 units of the book, and can explain any of these systems clearly and accurately in your own words whenever a user asks a physiology, anatomy-function, or "how does the body do X" style question.
- Unit I – Introduction to Physiology (the cell & general physiology): the body is made of about 100 trillion cells living in a shared "internal environment" (extracellular fluid); homeostasis (a term coined by Walter Cannon) is the maintenance of stable internal conditions via control systems that are mostly negative feedback (correcting a deviation back toward normal) with a few useful positive-feedback loops (e.g., childbirth, blood clotting, nerve action potentials); also covers how DNA's genetic code controls protein synthesis (transcription into mRNA, translation into proteins) and cell reproduction.
- Unit II – Membrane Physiology, Nerve, and Muscle: covers how substances cross cell membranes (simple/facilitated diffusion, osmosis, active transport, ion channels and pumps like the Na+/K+ pump); resting membrane potential and how action potentials fire via fast sodium influx followed by potassium efflux; skeletal muscle contraction through the sliding-filament mechanism of actin and myosin within sarcomeres; neuromuscular transmission at the motor end plate (acetylcholine release) and excitation-contraction coupling; and how smooth muscle contracts differently from skeletal muscle (slower, calcium-calmodulin-myosin light chain kinase pathway).
- Unit III – The Heart: cardiac muscle behaves like a functional syncytium; the heart's four chambers and valves work as a pump through the cardiac cycle (systole/diastole); rhythmic excitation originates in the SA node ("pacemaker"), passes through the AV node (with its delay) and the Purkinje fibers; the normal ECG shows the P wave (atrial depolarization), QRS complex (ventricular depolarization) and T wave (ventricular repolarization); and various arrhythmias (tachycardia, bradycardia, fibrillation, heart block) can be diagnosed from ECG abnormalities.
- Unit IV – The Circulation: blood flow depends on the relationship between pressure, flow and resistance (Ohm's-law-like: Flow = ΔPressure / Resistance, strongly influenced by vessel radius); arteries are high-pressure distribution vessels while veins are compliant, low-pressure reservoirs; capillaries exchange fluid and solutes with tissues (Starling forces), and the lymphatic system returns excess interstitial fluid and proteins to the blood; local, hormonal and nervous mechanisms (e.g., the vasomotor center and arterial baroreceptors) regulate blood flow and arterial pressure moment to moment, while the kidneys are central to long-term blood pressure control and hypertension; cardiac output equals venous return and is regulated by preload, afterload, contractility and heart rate; exercise dramatically increases muscle blood flow and cardiac output; and the unit also covers heart failure, valvular/congenital heart defects, and circulatory shock.
- Unit V – Body Fluids and Kidneys: body water is divided into intracellular and extracellular (plasma + interstitial) compartments; kidneys filter blood at the glomerulus and then selectively reabsorb/secrete substances along the renal tubule (proximal tubule, loop of Henle, distal tubule, collecting duct); the countercurrent multiplier in the loop of Henle allows the kidney to concentrate or dilute urine as needed; the kidneys tightly regulate sodium, potassium, calcium, phosphate and magnesium balance, and along with the lungs, regulate acid-base balance (via bicarbonate buffering, respiratory compensation, and renal acid/base excretion); the unit also covers diuretics and common kidney diseases.
- Unit VI – Blood Cells, Immunity, and Coagulation: red blood cells (erythrocytes) carry oxygen via hemoglobin, with disorders like anemia (too few/dysfunctional RBCs) and polycythemia (too many); white blood cells provide innate immunity (neutrophils, macrophages, inflammation) and adaptive immunity (B lymphocytes producing antibodies, T lymphocytes for cell-mediated immunity), with allergy being an overactive immune response; blood types (ABO and Rh systems) must be matched for safe transfusion and organ transplantation; and hemostasis/blood clotting involves platelets plugging vessel injuries plus a cascade of clotting factors forming a fibrin clot.
- Unit VII – Respiration: pulmonary ventilation moves air in and out via pressure changes created by the diaphragm and chest wall; pulmonary circulation is a low-pressure system prone to edema if pressures rise too high; gas exchange occurs by diffusion across the thin respiratory membrane in the alveoli; oxygen is carried mostly bound to hemoglobin (described by the oxygen-hemoglobin dissociation curve) while CO2 is carried as bicarbonate, dissolved gas, and bound to hemoglobin; breathing rate/depth is regulated by the respiratory center in the brainstem responding mainly to blood CO2/pH (via central and peripheral chemoreceptors); and respiratory insufficiency is managed with oxygen therapy and other supportive measures.
- Unit VIII – Aviation, Space, and Deep-Sea Diving Physiology: covers effects of high altitude/low oxygen pressure (hypoxia, acclimatization, altitude sickness) on aviators and mountaineers, physiological effects of space travel/microgravity (fluid shifts, bone/muscle loss), and diving physiology, including nitrogen narcosis, oxygen toxicity, and decompression sickness ("the bends") from breathing gases at high pressure.
- Unit IX – Nervous System (general principles & sensory): describes how neurons communicate via synapses and neurotransmitters (excitatory and inhibitory), how sensory receptors convert stimuli into nerve signals and how neuronal circuits process information, and the general/somatic sensory pathways for touch, position sense (proprioception), pain, headache and thermal sensation.
- Unit X – Nervous System (special senses): vision — how the eye's optics focus light, how retinal photoreceptors (rods and cones) transduce light into neural signals, and how the visual cortex processes that information; hearing — how the ear converts sound waves into nerve impulses via the cochlea; and the chemical senses of taste and smell.
- Unit XI – Nervous System (motor & integrative neurophysiology): spinal cord reflexes (e.g., the stretch reflex) as the simplest motor circuits; how the cortex and brainstem control voluntary movement; the cerebellum's role in coordinating smooth, balanced movement and the basal ganglia's role in initiating/regulating movement; the cerebral cortex's role in higher intellectual functions, learning and memory; the limbic system and hypothalamus governing emotion, motivation, hunger, thirst and basic drives; brain states such as sleep stages, brain waves (EEG), epilepsy, and dementia; the autonomic nervous system (sympathetic "fight-or-flight" and parasympathetic "rest-and-digest" divisions) and adrenal medulla; and regulation of cerebral blood flow and cerebrospinal fluid.
- Unit XII – Gastrointestinal Physiology: the GI tract has its own enteric nervous system controlling motility and secretion, coordinated with the autonomic nervous system and local hormones (gastrin, secretin, CCK); peristalsis and segmentation propel and mix food; glands secrete saliva, gastric acid/pepsin, pancreatic enzymes and bicarbonate, and bile (from the liver, stored in the gallbladder) to digest food; nutrients (carbohydrates, proteins, fats, vitamins, minerals, water) are absorbed mainly in the small intestine; and the unit covers common GI disorders.
- Unit XIII – Metabolism and Temperature Regulation: describes how carbohydrates, lipids and proteins are metabolized to produce ATP (via glycolysis, the citric acid cycle and oxidative phosphorylation); the liver's central role in metabolism, detoxification and storage; dietary balance, appetite regulation, obesity, starvation, vitamins and minerals; how metabolic (basal) rate is measured and what affects it; and how the hypothalamus regulates body temperature and produces fever in response to infection.
- Unit XIV – Endocrinology and Reproduction: hormones act via specific receptors to regulate distant target cells; the hypothalamus and pituitary gland ("master gland") control most other endocrine glands; thyroid hormones set the body's metabolic pace; adrenal cortex hormones (cortisol, aldosterone) regulate stress response, metabolism, and sodium/potassium balance; insulin and glucagon regulate blood glucose, with diabetes mellitus resulting from insulin deficiency or resistance; parathyroid hormone, calcitonin and vitamin D regulate calcium/phosphate and bone; and the unit covers male and female reproductive hormones and physiology, the menstrual cycle, pregnancy, lactation, and fetal/neonatal physiology.
- Unit XV – Sports Physiology: covers how muscles, the cardiovascular system and the respiratory system adapt to exercise training (e.g., increased muscle strength/endurance, cardiac hypertrophy, improved oxygen delivery), and factors that affect athletic performance such as muscle fiber type, body composition, and conditioning.
- When a user asks any physiology/anatomy-function question — how an organ system works, mechanisms behind symptoms, basic pharmacology-adjacent physiology, or general "why does the body do X" questions — answer confidently and clearly using the above framework, explained simply in your own words like a good physiology teacher, and expand with your general medical knowledge as needed. For any question that sounds like a request for individual medical diagnosis, treatment, or advice about a specific person's symptoms, answer the general physiology/science behind it but also gently suggest they consult a qualified doctor for personal medical advice — you are not a substitute for a real physician.`;

  // ---- Web search (no API key needed) ----
  // Uses DuckDuckGo's free HTML results pages, fetched through public CORS
  // proxies (since browsers can't fetch duckduckgo.com directly cross-origin),
  // then parses the returned HTML for titles/snippets/links.
  //
  // Two independent points of failure exist here, so both are covered:
  // 1) Free CORS proxies (allorigins etc.) are individually unreliable —
  //    they go down or rate-limit without warning.
  // 2) DuckDuckGo's main HTML page sometimes serves an anti-bot page to
  //    proxy traffic; its "lite" page is a simpler, less-blocked fallback.
  // Every (target page) x (proxy) combination is tried in turn; we only
  // give up and tell the model to answer from its own knowledge if every
  // single combination fails.
  function extractRealUrl(href){
    try{
      if(href.startsWith('//')) href = 'https:' + href;
      const u = new URL(href, 'https://duckduckgo.com');
      const uddg = u.searchParams.get('uddg');
      return uddg ? decodeURIComponent(uddg) : href;
    }catch(e){
      return href;
    }
  }

  const CORS_PROXIES = [
    (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    (url) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
    (url) => "https://corsproxy.io/?url=" + encodeURIComponent(url)
  ];

  async function fetchWithTimeout(url, ms = 7000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try{
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  function parseDuckDuckGoHtml(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const results = [];
    const items = doc.querySelectorAll('.result');
    items.forEach((item) => {
      if(results.length >= 8) return;
      const titleEl = item.querySelector('.result__title a, a.result__a');
      if(!titleEl) return;
      const snippetEl = item.querySelector('.result__snippet');
      const title = titleEl.textContent.trim();
      const link = extractRealUrl(titleEl.getAttribute('href') || '');
      const snippet = snippetEl ? snippetEl.textContent.trim() : '';
      if(title) results.push(`${results.length + 1}. ${title}\n${snippet}\n${link}`);
    });
    return results;
  }

  // Google News RSS — gives dated, source-attributed news items (title, publisher,
  // publish date, link), which is what lets the model reason about "current vs
  // past" news instead of just generic undated web snippets.
  function parseGoogleNewsRss(xml){
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const results = [];
    const items = doc.querySelectorAll('item');
    items.forEach((item) => {
      if(results.length >= 8) return;
      const title = (item.querySelector('title')?.textContent || '').trim();
      const link = (item.querySelector('link')?.textContent || '').trim();
      const pubDate = (item.querySelector('pubDate')?.textContent || '').trim();
      const sourceEl = item.querySelector('source');
      const source = sourceEl ? sourceEl.textContent.trim() : '';
      if(!title) return;
      const meta = [source, pubDate].filter(Boolean).join(' — ');
      results.push(`${results.length + 1}. ${title}${meta ? ' (' + meta + ')' : ''}\n${link}`);
    });
    return results;
  }

  // DuckDuckGo's "lite" page has a plainer table markup — no JS, minimal
  // styling — so it's flagged as a bot/scraper far less often than the
  // full html.duckduckgo.com page.
  function parseDuckDuckGoLite(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const results = [];
    const links = doc.querySelectorAll('a.result-link');
    links.forEach((a) => {
      if(results.length >= 8) return;
      const title = a.textContent.trim();
      if(!title) return;
      const link = extractRealUrl(a.getAttribute('href') || '');
      let snippet = '';
      const parentRow = a.closest('tr');
      const snippetRow = parentRow ? parentRow.nextElementSibling : null;
      const snippetEl = snippetRow ? snippetRow.querySelector('.result-snippet') : null;
      if(snippetEl) snippet = snippetEl.textContent.trim();
      results.push(`${results.length + 1}. ${title}\n${snippet}\n${link}`);
    });
    return results;
  }

  const SEARCH_TARGETS = [
    { build: (q) => "https://lite.duckduckgo.com/lite/?q=" + encodeURIComponent(q), parse: parseDuckDuckGoLite },
    { build: (q) => "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=en-IN&gl=IN&ceid=IN:en", parse: parseGoogleNewsRss, label: "News" },
    { build: (q) => "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q), parse: parseDuckDuckGoHtml }
  ];

  // Runs a single target (through each CORS proxy in turn) and returns its
  // parsed results array, or null if every proxy for that target failed.
  async function runSearchTarget(target, query){
    const targetUrl = target.build(query);
    for(const buildProxyUrl of CORS_PROXIES){
      try{
        const proxyUrl = buildProxyUrl(targetUrl);
        const resp = await fetchWithTimeout(proxyUrl, 7000);
        if(!resp.ok) continue; // this proxy failed, try the next one
        const body = await resp.text();
        if(!body || body.length < 200) continue; // suspiciously empty/blocked response
        const results = target.parse(body);
        if(results.length) return results;
        // parsed fine but no results found (e.g. DDG anti-bot page) — try next combo
      }catch(err){
        console.error('webSearch combo failed, trying next:', err);
      }
    }
    return null;
  }

  async function webSearch(query){
    // Try the general web target first (fast, broad coverage).
    const general = await runSearchTarget(SEARCH_TARGETS[0], query);

    // Also pull dated news results in parallel-ish fashion so the model has
    // both general/background info AND recency-stamped news items to reason
    // "current vs past" from — this is what makes news/timeline questions work.
    const news = await runSearchTarget(SEARCH_TARGETS[1], query);

    if(general || news){
      const parts = [];
      if(news) parts.push("Dated news results:\n" + news.join('\n\n'));
      if(general) parts.push("General web results:\n" + general.join('\n\n'));
      return parts.join('\n\n---\n\n');
    }

    // Both primary targets failed — last-resort fallback.
    const fallback = await runSearchTarget(SEARCH_TARGETS[2], query);
    if(fallback) return "General web results:\n" + fallback.join('\n\n');

    return "Search request failed (network/proxy error) — answer using your own knowledge instead.";
  }

  function nowTime(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return `${h}:${m} ${ampm}`;
  }

  (function initWelcomeTime(){
    const el = document.getElementById('welcomeTime');
    if(el) el.textContent = nowTime();
  })();

  // ---- Dynamic Island: fast "Algebra" fly-in text + feeling-based cat ----
  let islandRevertTimer = null;

  function triggerIslandTextSlide(){
    if(!islandNameEl) return;
    islandNameEl.classList.remove('slide-in');
    void islandNameEl.offsetWidth; // force reflow so the animation restarts
    islandNameEl.classList.add('slide-in');
  }

  function showIslandText(){
    if(!islandNameEl || !islandCatEl) return;
    islandCatEl.style.display = 'none';
    islandCatEl.className = 'island-cat';
    islandNameEl.style.display = '';
    triggerIslandTextSlide();
  }

  function showIslandCat(mood){
    if(!islandNameEl || !islandCatEl) return;
    if(islandRevertTimer){ clearTimeout(islandRevertTimer); islandRevertTimer = null; }
    islandNameEl.style.display = 'none';
    islandCatEl.className = 'island-cat mood-' + (mood || 'neutral');
    islandCatEl.style.display = 'flex';
  }

  function scheduleIslandRevert(){
    if(islandRevertTimer) clearTimeout(islandRevertTimer);
    islandRevertTimer = setTimeout(() => {
      showIslandText();
      islandRevertTimer = null;
    }, 2000);
  }

  // Lightweight bilingual (Hindi/Hinglish + English) mood detector — decides
  // which cat expression matches the "feel" of the chat text.
  function detectMood(text){
    if(!text) return 'neutral';
    const t = String(text).toLowerCase();
    const angryWords = ['gussa','angry','hate','irritat','stupid','bakwas','chutiya','pagal','ghatiya','bekar','nonsense','rude'];
    const sadWords = ['sad','dukhi','upset','ro raha','rona','depress','udaas','pareshan','dard','hurt','lonely','akela','cry','miss you','heartbroken'];
    const excitedWords = ['wow','omg','excited','yay','zabardast','shaandaar','mast','amazing','awesome','!!'];
    const happyWords = ['thanks','thank you','great','love','haha','lol','achha','badhiya','shukriya','happy','khush','😊','😂','❤','🙏','good job','nice'];
    if(angryWords.some(w => t.includes(w))) return 'angry';
    if(sadWords.some(w => t.includes(w))) return 'sad';
    if(excitedWords.some(w => t.includes(w))) return 'excited';
    if(happyWords.some(w => t.includes(w))) return 'happy';
    return 'neutral';
  }

  // Show the fast left-to-right "Algebra" fly-in the moment the app opens/refreshes.
  triggerIslandTextSlide();

  // ---- Lightweight markdown-ish renderer: fenced code, inline code, bold, auto-hyperlinks ----
  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderMarkdownLite(text){
    if(text == null) return '';
    const codeBlocks = [];
    // Pull out ```lang\ncode``` fenced blocks first so nothing inside them gets escaped-twice or linkified
    let working = String(text).replace(/```([a-zA-Z0-9+#.-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
      return `\u0000CODEBLOCK${idx}\u0000`;
    });

    let escaped = escapeHtml(working);

    // inline `code`
    escaped = escaped.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    // **bold**
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    // auto-hyperlink plain URLs
    escaped = escaped.replace(/(https?:\/\/[^\s<]+)/g, (m) => {
      const clean = m.replace(/[).,!?;:]+$/, '');
      const trailing = m.slice(clean.length);
      return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${trailing}`;
    });

    // restore fenced code blocks
    escaped = escaped.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (m, idx) => codeBlocks[Number(idx)]);
    return escaped;
  }

  // Splits long plain-text answers into ~200-500 char reader-friendly chunks,
  // breaking on paragraph/sentence/word boundaries where possible.
  function splitIntoChunks(text, minLen = 200, maxLen = 500){
    const chunks = [];
    let remaining = text;
    while(remaining.length > maxLen){
      const slice = remaining.slice(0, maxLen);
      let breakIdx = -1;
      let idx = slice.lastIndexOf('\n\n');
      if(idx >= minLen) breakIdx = idx + 2;
      if(breakIdx === -1){
        idx = slice.lastIndexOf('. ');
        if(idx >= minLen) breakIdx = idx + 2;
      }
      if(breakIdx === -1){
        idx = slice.lastIndexOf('\n');
        if(idx >= minLen) breakIdx = idx + 1;
      }
      if(breakIdx === -1){
        idx = slice.lastIndexOf(' ');
        if(idx >= minLen) breakIdx = idx + 1;
      }
      if(breakIdx === -1) breakIdx = maxLen;
      chunks.push(remaining.slice(0, breakIdx).trimEnd());
      remaining = remaining.slice(breakIdx).trimStart();
    }
    if(remaining) chunks.push(remaining);
    return chunks;
  }

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const hasCodeFence = /```/.test(text || '');

    if(role === 'bot' && !hasCodeFence && String(text || '').length > 500){
      // Long plain-text bot answer: show first chunk + tap-to-continue "More" link
      const chunks = splitIntoChunks(String(text));
      const contentSpan = document.createElement('span');
      bubble.appendChild(contentSpan);
      const moreBtn = document.createElement('a');
      moreBtn.className = 'more-link';
      moreBtn.textContent = 'More →';
      let shown = 0;
      function revealNext(){
        contentSpan.innerHTML += (shown > 0 ? ' ' : '') + renderMarkdownLite(chunks[shown]);
        shown++;
        if(shown >= chunks.length){
          moreBtn.remove();
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      moreBtn.addEventListener('click', revealNext);
      revealNext();
      bubble.appendChild(moreBtn);
    } else {
      bubble.innerHTML = renderMarkdownLite(text);
    }

    const timeSpan = document.createElement('span');
    timeSpan.className = 'time-inline';
    timeSpan.textContent = nowTime();
    bubble.appendChild(timeSpan);

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  // User-facing error bubble — now shows the actual API/network error detail
  // so the user knows what went wrong (e.g. invalid key, rate limit, network).
  // Tapping "Try Again" refills the composer (and re-attaches any image)
  // with the exact message that failed, so the user doesn't have to retype it.
  function addRetryBubble(retryText, retryImage, errorDetail){
    const row = document.createElement('div');
    row.className = 'row bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const msgSpan = document.createElement('span');
    // Never surface raw API/internal error text to the user — always show a
    // generic friendly message. The real error is still logged to console
    // (see sendMessage's catch block) for developer debugging only.
    msgSpan.textContent = 'Sorry, something went wrong. Please try again.';
    bubble.appendChild(msgSpan);

    const retryBtn = document.createElement('a');
    retryBtn.className = 'more-link';
    retryBtn.style.display = 'block';
    retryBtn.textContent = 'Try Again ↻';
    retryBtn.addEventListener('click', () => {
      inputEl.value = retryText || '';
      if(retryImage){
        pendingImage = retryImage;
        attachThumb.src = retryImage.dataUrl;
        attachName.textContent = retryImage.name;
        attachPreview.style.display = 'flex';
      }
      inputEl.focus();
    });
    bubble.appendChild(retryBtn);

    const timeSpan = document.createElement('span');
    timeSpan.className = 'time-inline';
    timeSpan.textContent = nowTime();
    bubble.appendChild(timeSpan);

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function openImageOverlay(dataUrl){
    const overlay = document.createElement('div');
    overlay.className = 'img-overlay';
    const img = document.createElement('img');
    img.src = dataUrl;
    overlay.appendChild(img);
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function addImageBubble(role, dataUrl, caption){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble img-bubble';

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.src = dataUrl;
    wrap.appendChild(img);

    // Double-tap / double-click on the 4:3 thumbnail opens full-size overlay.
    // Tapping again inside the overlay returns to the 4:3 feed view (overlay closes).
    let lastTap = 0;
    wrap.addEventListener('click', () => {
      const now = Date.now();
      if(now - lastTap < 350){
        openImageOverlay(dataUrl);
      }
      lastTap = now;
    });
    wrap.addEventListener('dblclick', () => openImageOverlay(dataUrl));

    bubble.appendChild(wrap);

    if(caption && caption.trim()){
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.innerHTML = renderMarkdownLite(caption);
      bubble.appendChild(cap);
    }

    const timeSpan = document.createElement('span');
    timeSpan.className = 'time-inline';
    timeSpan.textContent = nowTime();
    bubble.appendChild(timeSpan);

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    const image = pendingImage;

    if(!text && !image) return;

    // Snapshot of exactly what the user sent, kept aside so it can be
    // restored into the composer if this attempt fails (see addRetryBubble).
    const retryText = text;
    const retryImage = image ? { base64: image.base64, mediaType: image.mediaType, name: image.name, dataUrl: image.dataUrl } : null;

    // Dynamic Island: swap "Algebra" text for the feeling-based cat the moment a message is sent.
    showIslandCat(detectMood(text));

    if(image){
      addImageBubble('user', image.dataUrl, text);
      const content = [
        { type: 'image', source: { type: 'base64', media_type: image.mediaType, data: image.base64 } }
      ];
      content.push({ type: 'text', text: text ? text : 'Please describe this image.' });
      history.push({ role: 'user', content: content });
    } else {
      addBubble('user', text);
      history.push({ role: 'user', content: text });
    }

    inputEl.value = '';
    pendingImage = null;
    fileInput.value = '';
    attachPreview.style.display = 'none';
    sendBtn.disabled = true;
    addTyping();

    try{
      // Convert Anthropic-style content blocks (used internally for images)
      // into Gemini "parts" format.
      function convertContentParts(content){
        if(typeof content === 'string') return [{ text: content }];
        if(!Array.isArray(content)) return [{ text: String(content ?? '') }];
        return content.map(block => {
          if(block.type === 'text') return { text: block.text };
          if(block.type === 'image'){
            const mediaType = block.source?.media_type || 'image/jpeg';
            const data = block.source?.data || '';
            return { inline_data: { mime_type: mediaType, data: data } };
          }
          return { text: '' };
        });
      }

      const liveSystemPrompt = SYSTEM_PROMPT + `\n\nCurrent real-world date & time right now: ${getCurrentDateTimeStr()}`;

      // Gemini uses "user" / "model" roles (not "assistant") and takes the
      // system prompt as a separate top-level field rather than a message.
      let geminiContents = history.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: convertContentParts(m.content)
      }));

      async function callGemini(contents){
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: liveSystemPrompt }] },
            contents: contents,
            generationConfig: { maxOutputTokens: 1000 }
          })
        });
        const data = await response.json();
        const candidate = data && data.candidates && data.candidates[0];
        const text = candidate && candidate.content && candidate.content.parts
          ? candidate.content.parts.map(p => p.text || '').join('')
          : '';
        if(text) return text;
        if(data && data.error){
          // Surface the real API error (e.g. invalid key, quota exceeded,
          // model overloaded) so the user sees what actually went wrong.
          const status = data.error.status ? ` (${data.error.status})` : '';
          throw new Error((data.error.message || "unknown error") + status);
        }
        if(!response.ok){
          throw new Error(`Request failed with status ${response.status}`);
        }
        return "Sorry, something went wrong. Please try again.";
      }

      let replyText = await callGemini(geminiContents);

      // If the model asked to search the web (SEARCH: <query> as its whole reply),
      // run the search, feed the results back, and let it produce the real answer.
      const searchMatch = /^\s*SEARCH:\s*(.+?)\s*$/i.exec(replyText || "");
      if(searchMatch){
        const query = searchMatch[1];
        const searchResults = await webSearch(query);
        geminiContents = [
          ...geminiContents,
          { role: 'model', parts: [{ text: replyText }] },
          { role: 'user', parts: [{ text: `Web search results for "${query}":\n\n${searchResults}\n\nUsing these results, now give the user a complete, direct, natural answer. Do not mention "SEARCH:" or that you performed a search — just answer as if you knew it.` }] }
        ];
        replyText = await callGemini(geminiContents);
      }

      removeTyping();
      addBubble('bot', replyText);
      history.push({ role: 'assistant', content: replyText });
      // Refresh the island cat's mood to reflect the feeling of the full exchange.
      showIslandCat(detectMood((retryText || '') + ' ' + (replyText || '')));
    }catch(err){
      removeTyping();
      // Log full internal/API error detail to console only — never shown to the user.
      console.error(err);
      addRetryBubble(retryText, retryImage);
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
      // Chat has stopped for this turn — after 2s, fly the "Algebra" text back in.
      scheduleIslandRevert();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
</script>
